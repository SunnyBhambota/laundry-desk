name: laundry_desk
description: "Laundry Desk – laundry shop management by BrotriX Technologies."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  crypto: ^3.0.5
  # WhatsApp bills / reminders, call, maps
  url_launcher: ^6.3.0
  # login + cloud (works without these in demo mode until Firebase is set up)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#1F5FD1"
  adaptive_icon_foreground: assets/images/app_icon_fg.png
