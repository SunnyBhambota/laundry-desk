name: laundry_desk
description: "Laundry Desk – laundry shop management by BrotriX Technologies."
publish_to: 'none'
version: 0.3.0+3

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10
  crypto: ^3.0.5
  # WhatsApp bills / reminders, call, maps
  url_launcher: ^6.3.0
  # print / export: PDF bills, QR tags, reports, CSV
  pdf: ^3.11.1
  printing: ^5.13.4
  share_plus: ^10.1.2
  # delivery staff GPS tracking
  geolocator: ^13.0.2
  # v0.3: QR tag scan, UPI QR, Bluetooth thermal printer, backup restore
  mobile_scanner: ^6.0.2
  qr_flutter: ^4.1.0
  print_bluetooth_thermal: ^1.1.6
  permission_handler: ^11.3.1
  file_picker: '>=8.0.0 <11.0.0'
  # login + cloud (works without these in demo mode until Firebase is set up)
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/app_icon_fg.png
