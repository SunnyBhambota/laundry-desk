name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files (keeps our own files)
        run: flutter create --org com.brotrix --project-name laundry_desk --platforms android .

      - name: Android settings (minSdk 23 for Firebase, app name)
        run: |
          F=android/app/build.gradle.kts
          [ -f "$F" ] || F=android/app/build.gradle
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$F"
          # Play Store / Firebase app id (fixed forever once published): com.brotrix.laundry
          sed -i 's/applicationId = "com.brotrix.laundry_desk"/applicationId = "com.brotrix.laundry"/; s/applicationId "com.brotrix.laundry_desk"/applicationId "com.brotrix.laundry"/' "$F"
          grep -n "applicationId" "$F"
          sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' "$F"
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="laundry_desk"/android:label="Laundry Desk"/' "$M"
          # WhatsApp / phone / maps links (url_launcher) on Android 11+
          grep -q '<queries>' "$M" && sed -i 's#<queries>#<queries>\n        <intent><action android:name="android.intent.action.VIEW" /><data android:scheme="https" /></intent>\n        <intent><action android:name="android.intent.action.DIAL" /><data android:scheme="tel" /></intent>#' "$M"
          # GPS for delivery tracking, internet for cloud + fonts
          sed -i '0,/<application/s##<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />\n    <application#' "$M"
          grep -n "minSdk" "$F"
          grep -n "label\|queries\|permission" "$M"

      - name: Use the app's fixed signing key (same SHA-1 every build, for Firebase)
        run: |
          mkdir -p ~/.android
          cp ci/debug.keystore ~/.android/debug.keystore

      - run: rm -f test/widget_test.dart
      - run: flutter pub get
      - name: App icon
        run: dart run flutter_launcher_icons
      - name: Code check
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Tests
        run: flutter test
      - name: Build APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: laundry-desk-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # Opens the APK on an Android emulator. If the app does not stay open, nothing is published.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: laundry-desk-apk

      - name: Free disk space for the emulator
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/share/swift /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 3000M
          script: |
            adb install -r app-release.apk
            adb logcat -c
            adb shell am start -n com.brotrix.laundry/com.brotrix.laundry_desk.MainActivity
            sleep 35
            adb logcat -d > logcat.txt || true
            grep -n -A25 "FATAL EXCEPTION" logcat.txt | head -80 || true
            adb exec-out screencap -p > screen.png || true
            adb shell pidof com.brotrix.laundry > /dev/null && echo "App is running" || (echo "::error::App closed right after opening" && exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-check
          path: |
            logcat.txt
            screen.png

  publish:
    needs: smoke
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: laundry-desk-apk

      # Fixed download link (QR in README):
      # https://github.com/SunnyBhambota/laundry-desk/releases/latest/download/laundry-desk.apk
      - name: Publish APK to Releases (main branch only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          cp app-release.apk laundry-desk.apk
          gh release create "v${VER}-build${{ github.run_number }}" laundry-desk.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Laundry Desk v${VER} (build ${{ github.run_number }})" \
            --notes "Phone par install: https://github.com/${{ github.repository }}/releases/latest/download/laundry-desk.apk" \
            --latest
